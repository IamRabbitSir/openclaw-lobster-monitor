<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenClaw Lobster Monitor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="voxyz-body">
    <div class="voxyz-container">
      <header class="voxyz-header">
        <h1 class="voxyz-title">Agents Online</h1>
      </header>

      <main class="voxyz-main">
        <div class="voxyz-dashboard">
          <div class="voxyz-dashboard-header">
            <div class="voxyz-status-badges">
              <span class="voxyz-live-feed">LIVE FEED</span>
              <span class="voxyz-signals-counter">5 signals processed today</span>
            </div>
            <button class="voxyz-office-button">See the Office →</button>
          </div>

          <div class="voxyz-agents-grid" id="agents-grid">
            <!-- Agent cards will be dynamically generated here -->
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
